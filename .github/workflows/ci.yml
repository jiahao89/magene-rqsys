name: verify

# 最小 CI：安装 → typecheck → 迁移文件名检查 → 测试（API + Web）→ build → 契约矩阵 → 两仓对齐 → 空白检查。
#
# 两仓对齐需要 rq-sys-miaoda/ 这个独立运行时仓。它在 GitHub 上不可匿名检出，
# 因此仅在配置了 RQSYS_MIAODA_REPO_URL / RQSYS_MIAODA_TOKEN 时执行；未配置时明确标记为"未运行"，
# 不能让它看起来像通过（这是之前的问题：缺目录时静默跳过，等于没有门禁）。
#
# 目标环境（妙搭）验证不在此流水线内：本地/CI 结果不能替代目标证据。

on:
  push:
    # feature/** 必须在内：日常开发都在 feature 分支上，只盯 main 等于日常零门禁。
    branches: [main, "sprint/**", "feature/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rqsys
          POSTGRES_PASSWORD: rqsys
          POSTGRES_DB: rqsys
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rqsys"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://rqsys:rqsys@127.0.0.1:5432/rqsys
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
        with:
          # 空白检查按 merge-base 与目标分支比较，需要完整历史。
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Migration filename check
        run: npm run check:migrations

      - name: OpenAPI contract syntax and path-param check
        run: |
          python3 - <<'PY'
          import re, sys, yaml
          with open("specs/rq-sys-mvp/openapi.yaml", "r", encoding="utf-8") as f:
              raw = f.read()
          doc = yaml.safe_load(raw)
          assert isinstance(doc, dict) and "paths" in doc, "OpenAPI document missing paths"
          errors = []
          # 1. Path parameter consistency
          for path, item in doc["paths"].items():
              url_vars = set(re.findall(r"\{([^}]+)\}", path))
              item_params = item.get("parameters", []) if isinstance(item, dict) else []
              for method, op in (item.items() if isinstance(item, dict) else []):
                  if method not in ("get", "post", "put", "patch", "delete", "options", "head"):
                      continue
                  declared = set()
                  for p in list(item_params) + list(op.get("parameters", [])):
                      if "$ref" in p:
                          ref_name = p["$ref"].split("/")[-1]
                          p = doc.get("components", {}).get("parameters", {}).get(ref_name, {})
                      if p.get("in") == "path":
                          declared.add(p.get("name"))
                  if url_vars != declared:
                      errors.append(f"{method.upper()} {path}: url_vars={sorted(url_vars)} != declared={sorted(declared)}")
          # 2. Internal $ref resolution
          def check_refs(node):
              if isinstance(node, dict):
                  ref = node.get("$ref")
                  if isinstance(ref, str) and ref.startswith("#/"):
                      cur = doc
                      for part in ref[2:].split("/"):
                          if not isinstance(cur, dict) or part not in cur:
                              errors.append(f"unresolved $ref: {ref}")
                              break
                          cur = cur[part]
                  for v in node.values():
                      check_refs(v)
              elif isinstance(node, list):
                  for v in node:
                      check_refs(v)
          check_refs(doc)
          # 3. OpenAPI 3.1 should not mix legacy OpenAPI 3.0 nullable: true
          if str(doc.get("openapi", "")).startswith("3.1") and re.search(r"\bnullable:\s*true\b", raw):
              errors.append("OpenAPI 3.1 spec contains legacy OpenAPI 3.0 'nullable: true'")
          if errors:
              print("OpenAPI validation failed:", file=sys.stderr)
              for err in errors:
                  print(f"  - {err}", file=sys.stderr)
              sys.exit(1)
          print(f"OpenAPI OK: {doc.get('openapi')} v{doc.get('info', {}).get('version')}, {len(doc['paths'])} paths")
          PY

      # 假绿守卫（2026-11-25）：一个测试文件被覆盖成实现代码后，node --test 会把它当成
      # 一个"通过"的文件级用例，CI 依然绿。这里要求每个测试文件真的注册用例；
      # API 用例总数下限在 npm test 的 runner（scripts/run-api-tests.mjs）里守。
      - name: Test file registration check
        run: npm run check:test-guards

      # 注意：GitHub Actions 不允许在 `if:` 条件里引用 secrets（会直接判为无效 workflow，
      # run 以 0 job 失败）。这里把 secrets 映射成 step 级 env，在脚本里判断是否可用；
      # 未配置时打印 warning 并跳过，后续 alignment 步骤会显式标记"未运行"。
      - name: Checkout Miaoda runtime repository
        run: |
          if [ -z "${RQSYS_MIAODA_REPO_URL}" ] || [ -z "${RQSYS_MIAODA_TOKEN}" ]; then
            echo "::warning title=Alignment gate NOT run::rq-sys-miaoda checkout skipped (missing repository secrets). Shared-module drift is unchecked in this run."
            exit 0
          fi
          # token 通过 http.extraheader 传入，不写进 remote URL，避免出现在 git 输出里。
          git -c "http.extraheader=Authorization: Bearer ${RQSYS_MIAODA_TOKEN}" \
            clone --depth 1 --branch sprint/default "${RQSYS_MIAODA_REPO_URL}" rq-sys-miaoda
        env:
          RQSYS_MIAODA_REPO_URL: ${{ secrets.RQSYS_MIAODA_REPO_URL }}
          RQSYS_MIAODA_TOKEN: ${{ secrets.RQSYS_MIAODA_TOKEN }}

      # ARCO-12：源码用到的 Arco 组件必须登记在 arco-styles.ts，否则运行时无样式。
      - name: Arco on-demand style registry check
        run: npm run check:arco-styles

      - name: Tests (API + Web)
        run: npm test

      # AGENTS.md 要求声明完成前跑 build：typecheck 只证明类型正确，
      # 打包/入口解析（ESM 扩展名、workspace 引用）只有 build 才会暴露。
      - name: Build
        run: npm run build

      # check:contract 的 db 边界直接读取 public schema：空库会以"必需表存在"FAIL 退出。
      # CI 的 postgres service 是空库（npm test 只在临时 schema 上跑迁移并回滚），
      # 所以这里先按仓库迁移把 CI 库建到与生产同构，再跑契约读取。
      # 使用 db:migrate:ci：只读环境变量 DATABASE_URL（上方 job env 已设置），不依赖本地 .env。
      - name: Apply migrations to the CI database
        run: npm --workspace @rq-sys/api run db:migrate:ci

      # 默认只读：缺凭据的边界记为 SKIP，只有 FAIL 才让流水线失败。
      - name: External contract matrix (read-only)
        run: npm run check:contract

      - name: Two-repository alignment
        env:
          RQSYS_REQUIRE_ALIGNMENT: ${{ vars.RQSYS_REQUIRE_ALIGNMENT }}
        run: |
          if [ -d rq-sys-miaoda ]; then
            npm run check:alignment
          else
            msg="rq-sys-miaoda/ was not checked out (missing RQSYS_MIAODA_REPO_URL / RQSYS_MIAODA_TOKEN secrets). Shared-module drift is UNCHECKED in this run."
            echo "::warning title=Alignment gate NOT run::${msg}"
            if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
              printf '### ⚠️ Two-repository alignment gate NOT run\n\n%s\n\nConfigure `RQSYS_MIAODA_REPO_URL` + `RQSYS_MIAODA_TOKEN` secrets (and optionally repository variable `RQSYS_REQUIRE_ALIGNMENT=true` to hard-fail on missing secrets).\n' "$msg" >> "$GITHUB_STEP_SUMMARY"
            fi
            if [ "${RQSYS_REQUIRE_ALIGNMENT:-}" = "true" ]; then
              echo "::error title=Alignment gate required::RQSYS_REQUIRE_ALIGNMENT=true but rq-sys-miaoda/ checkout is unavailable."
              exit 1
            fi
          fi

      - name: Whitespace check
        run: |
          # 与目标分支的 merge-base 比较，覆盖本分支上的全部提交；
          # 只比 HEAD^..HEAD 会在一次推送多个提交时漏掉前面的提交。
          if [ -n "${GITHUB_BASE_REF}" ] && git rev-parse --verify -q "origin/${GITHUB_BASE_REF}" >/dev/null; then
            base="origin/${GITHUB_BASE_REF}"
          elif git rev-parse --verify -q origin/main >/dev/null; then
            base="origin/main"
          else
            echo "No base branch available; checking the working tree instead."
            base=""
          fi
          if [ -n "${base}" ]; then
            git diff --check "$(git merge-base "$base" HEAD)" HEAD
          else
            git diff --check
          fi
