name: verify

# 最小 CI：安装 → typecheck → 迁移文件名检查 → 测试（API + Web）→ build → 契约矩阵 → 两仓对齐 → 空白检查。
#
# 两仓对齐需要 rq-sys-miaoda/ 这个独立运行时仓。它在 GitHub 上不可匿名检出，
# 因此仅在配置了 RQSYS_MIAODA_REPO_URL / RQSYS_MIAODA_TOKEN 时执行；未配置时明确标记为"未运行"，
# 不能让它看起来像通过（这是之前的问题：缺目录时静默跳过，等于没有门禁）。
#
# 目标环境（妙搭）验证不在此流水线内：本地/CI 结果不能替代目标证据。

on:
  push:
    branches: [main, "sprint/**"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rqsys
          POSTGRES_PASSWORD: rqsys
          POSTGRES_DB: rqsys
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rqsys"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://rqsys:rqsys@127.0.0.1:5432/rqsys
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
        with:
          # 空白检查按 merge-base 与目标分支比较，需要完整历史。
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Migration filename check
        run: npm run check:migrations

      - name: Tests (API + Web)
        run: npm test

      # AGENTS.md 要求声明完成前跑 build：typecheck 只证明类型正确，
      # 打包/入口解析（ESM 扩展名、workspace 引用）只有 build 才会暴露。
      - name: Build
        run: npm run build

      # 默认只读：缺凭据的边界记为 SKIP，只有 FAIL 才让流水线失败。
      - name: External contract matrix (read-only)
        run: npm run check:contract

      - name: Checkout Miaoda runtime repository
        id: miaoda
        if: ${{ secrets.RQSYS_MIAODA_REPO_URL != '' && secrets.RQSYS_MIAODA_TOKEN != '' }}
        run: |
          # token 通过 http.extraheader 传入，不写进 remote URL，避免出现在 git 输出里。
          git -c "http.extraheader=Authorization: Bearer ${RQSYS_MIAODA_TOKEN}" \
            clone --depth 1 --branch sprint/default "${RQSYS_MIAODA_REPO_URL}" rq-sys-miaoda
        env:
          RQSYS_MIAODA_REPO_URL: ${{ secrets.RQSYS_MIAODA_REPO_URL }}
          RQSYS_MIAODA_TOKEN: ${{ secrets.RQSYS_MIAODA_TOKEN }}

      - name: Two-repository alignment
        run: |
          if [ -d rq-sys-miaoda ]; then
            npm run check:alignment
          else
            echo "::warning title=Alignment gate NOT run::rq-sys-miaoda/ was not checked out (missing repository secrets). Shared-module drift is unchecked in this run."
          fi

      - name: Whitespace check
        run: |
          # 与目标分支的 merge-base 比较，覆盖本分支上的全部提交；
          # 只比 HEAD^..HEAD 会在一次推送多个提交时漏掉前面的提交。
          if [ -n "${GITHUB_BASE_REF}" ] && git rev-parse --verify -q "origin/${GITHUB_BASE_REF}" >/dev/null; then
            base="origin/${GITHUB_BASE_REF}"
          elif git rev-parse --verify -q origin/main >/dev/null; then
            base="origin/main"
          else
            echo "No base branch available; checking the working tree instead."
            base=""
          fi
          if [ -n "${base}" ]; then
            git diff --check "$(git merge-base "$base" HEAD)" HEAD
          else
            git diff --check
          fi
