<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RQ-Sys MVP 架构</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--paper:#f5f5f5;--ink:#2d3142;--muted:#4f5d75;--soft:#7a8399;--rule:rgba(45,49,66,.12);--accent:#eb6c36;--tint:rgba(235,108,54,.08);--link:#2e5aa8;--sans:'Geist','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;--serif:'Instrument Serif','Noto Serif','Songti SC',serif;--mono:'Geist Mono',ui-monospace,monospace}
    body{background:var(--paper);color:var(--ink);font-family:var(--sans);padding:40px 32px 48px}
    main{max-width:1280px;margin:0 auto}
    .eyebrow{font:500 11px var(--mono);letter-spacing:.16em;color:var(--muted);margin-bottom:8px}
    h1{font:400 34px/1.15 var(--serif);letter-spacing:-.02em;margin-bottom:8px}
    .subtitle{font-size:14px;color:var(--muted);margin-bottom:24px}
    .diagram-container{width:100%;overflow-x:auto}
    svg{display:block;width:100%;min-width:1280px}
    .note{border-top:1px solid var(--rule);margin-top:16px;padding-top:12px;font-size:12px;line-height:1.6;color:var(--muted)}
    @media print{.diagram-container{overflow-x:visible}svg{min-width:0}body{padding:20px}}
  </style>
</head>
<body>
<main>
  <p class="eyebrow">RQ-SYS · SYSTEM OVERVIEW</p>
  <h1>从 Teambition 到飞书协作</h1>

  </div>
  <p class="note">现状边界：Dev 已完成 311 条源需求对齐；应用中间链路的 AI → Base → 通知完整验收、错过周期恢复和租户访问验收仍未完成。每周同步与干系人通知保持关闭。此图描述 MVP 架构目标，不代表所有链路已在目标环境验收。</p>
</main>

</html>
