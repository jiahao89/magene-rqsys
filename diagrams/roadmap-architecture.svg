idth="1"/><text x="1084.0" y="332.0" text-anchor="middle" fill="#2d3142" font-family="Geist, 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="600">通知与提醒</text><text x="1084.0" y="352.0" text-anchor="middle" fill="#4f5d75" font-family="Geist, 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="400">待办 / 失败 / 超时 / 变更；渠道待确认</text><rect x="952" y="540" width="264" height="72" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/><text x="1084.0" y="568.0" text-anchor="middle" fill="#2d3142" font-family="Geist, 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="600">指标与复评看板</text><text x="1084.0" y="588.0" text-anchor="middle" fill="#4f5d75" font-family="Geist, 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="400">时效、采纳差异、VOC / NPS 关联</text><line x1="48" y1="644" x2="1232" y2="644" stroke="rgba(45,49,66,0.16)"/><text x="48" y="672" text-anchor="start" fill="#4f5d75" font-family="Geist, 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="400">治理贯穿：真实来源与模型推断分开标识；AI 建议不覆盖人工决策；模拟用户结果独立标注为假设。</text></svg>