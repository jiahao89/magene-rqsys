openapi: 3.1.0
info:
  title: RQ-Sys MVP API
  version: 0.1.0
  description: Teambition requirement intake, AI analysis, owner mapping and Feishu Base push.
servers:
  - url: /
security:
  - bearerAuth: []
paths:
  /api/health:
    get:
      security: []
      summary: Liveness probe
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { const: ok }
                  service: { type: string }
                required: [status, service]
  /api/health/ready:
    get:
      security: []
      summary: Database readiness probe
      responses:
        '200': { description: Database is reachable }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/overview/metrics:
    get:
      summary: Get full-dataset workflow counts, excluding synthetic acceptance fixtures
      responses:
        '200':
          description: Persisted counts independent of requirement-list pagination
          content:
            application/json:
              schema:
                type: object
                properties:
                  counts: { $ref: '#/components/schemas/OverviewMetrics' }
                required: [counts]
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/sources:
    get:
      summary: List configured sources
      responses:
        '200':
          description: Sources visible to the caller
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/SourceConfig' } }
                required: [items]
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      summary: Create the single product-group source (controlled initialization)
      description: Any signed-in Feishu user may create the single MVP source. The request body accepts only whitelisted configuration fields and never credentials.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SourceConfigUpdate' }
      responses:
        '201':
          description: Source created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SourceConfig' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: A source already exists }
  /api/sources/{id}:
    put:
      summary: Update a source project and schedule
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SourceConfigUpdate' }
      responses:
        '200': { description: Source configuration updated }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/sync/run:
    post:
      summary: Start a manual synchronization batch
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 8, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sourceId: { type: string, format: uuid }
                mode:
                  type: string
                  enum: [full_pipeline, source_only]
                  default: full_pipeline
                  description: source_only persists Teambition source data and snapshots without queuing AI analysis, owner matching, Base pushes, or notifications. A later full_pipeline run revisits pending analysis and eligible owner/push work, including unchanged source rows. Idempotency keys are hashed and namespaced by mode.
              required: [sourceId]
      responses:
        '202':
          description: Batch accepted (new or idempotent replay; replay returns the existing batch's current status)
          content:
            application/json:
              schema:
                type: object
                properties:
                  batchId: { type: string, format: uuid }
                  status: { $ref: '#/components/schemas/BatchStatus' }
                required: [batchId, status]
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Source already has an active batch }
  /api/batches:
    get:
      summary: List synchronization batches
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/BatchStatus' }
        - name: since
          in: query
          schema: { type: string, format: date-time }
        - name: until
          in: query
          schema: { type: string, format: date-time }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        '200': { description: Batches and next cursor }
  /api/batches/{id}:
    get:
      summary: Get a batch with item results
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Batch detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Batch' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/items/{id}/retry:
    post:
      summary: Retry one failed item
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 8, maxLength: 128 }
      responses:
        '202': { description: Retry accepted }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Item is not retryable }
  /api/requirements/{id}/kano-runs:
    post:
      summary: Trigger a manual Kano hypothesis run (V02-T14)
      description: >-
        Manual-only trigger pinning the requirement source version, audience confirmation state and
        the selected approved evidence version; one active run per requirement; queued on the
        isolated kano_run job type whose failures never touch main pipeline states.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [evidenceVersion]
              properties:
                evidenceVersion: { type: integer, minimum: 1 }
      responses:
        '202': { description: Run queued (runVersion returned). }
        '400': { $ref: '#/components/responses/Validation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Evidence not approved/PII-flagged, or an active run already exists. }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
    get:
      summary: List Kano runs with staleness flags (V02-T14)
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200': { description: Run history; entries carry staleInputs when pinned inputs lag current versions. }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/kano/evidence:
    get:
      summary: List Kano evidence versions (V02-T13)
      description: >-
        Maintainer-imported, de-identified interview summary snapshots. Only approved and
        non-PII-flagged versions may feed the Kano model input; updates create new immutable
        versions and never mutate referenced snapshots.
      responses:
        '200': { description: Version list with status and PII flags. }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      summary: Import a Kano evidence version (V02-T13)
      description: >-
        Creates the next immutable version with a PII scan; suspected findings mark the
        version piiFlagged and block approval. No editor, crawler, or vector store.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, summary, evidenceFragments]
              properties:
                title: { type: string, maxLength: 200 }
                sourceUrl: { type: string, maxLength: 500, nullable: true }
                sourceSection: { type: string, maxLength: 200, nullable: true }
                summary: { type: string, maxLength: 20000 }
                evidenceFragments:
                  type: array
                  items:
                    type: object
                    required: [ref, text]
                    properties:
                      ref: { type: string, maxLength: 40 }
                      text: { type: string, maxLength: 2000 }
                coverageNotes: { type: string, maxLength: 4000, nullable: true }
                knownAudiences: { type: array, items: { type: string, enum: [L1, L2, L3, L4, L5, L6] } }
                knownScenes: { type: string, maxLength: 500, nullable: true }
                interviewDate: { type: string, maxLength: 40, nullable: true }
      responses:
        '201': { description: Draft version created (may be piiFlagged). }
        '400': { $ref: '#/components/responses/Validation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /api/kano/evidence/{id}/approve:
    post:
      summary: Approve a Kano evidence version (V02-T13)
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200': { description: Approved. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: The version is PII-flagged; re-import a de-identified snapshot. }
  /api/requirements:
    get:
      summary: Search requirements by source and pipeline state
      parameters:
        - name: q
          in: query
          schema: { type: string, maxLength: 200 }
        - name: executorName
          in: query
          description: Exact TB executor display name selected from the maintained personnel list.
          schema: { type: string, minLength: 1, maxLength: 100 }
        - name: pullState
          in: query
          schema: { $ref: '#/components/schemas/PullState' }
        - name: analysisState
          in: query
          schema: { $ref: '#/components/schemas/AnalysisState' }
        - name: ownerState
          in: query
          schema: { $ref: '#/components/schemas/OwnerState' }
        - name: pushState
          in: query
          schema: { $ref: '#/components/schemas/PushState' }
        - name: batchId
          in: query
          schema: { type: string, format: uuid }
        - name: since
          in: query
          description: Inclusive lower bound for the requirement's latest sync time (last_seen_at).
          schema: { type: string, format: date-time }
        - name: until
          in: query
          description: Inclusive upper bound for the requirement's latest sync time (last_seen_at).
          schema: { type: string, format: date-time }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        '200': { description: Requirement page }
    post:
      summary: Create a web-manual requirement (V02-T04)
      description: >-
        Minimal intake requires title, description and a fixed source channel. The actor,
        server time, source type (web_manual) and the RQ platform id are generated server-side.
        Requires an Idempotency-Key: the same key with the same payload replays the original
        result; the same key with a different payload is rejected as a conflict. The
        requirement, first source snapshot, audit event, intake receipt and first analysis
        job are committed in one transaction.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 8, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, description, sourceChannel]
              properties:
                title: { type: string, minLength: 1, maxLength: 200 }
                description: { type: string, minLength: 1, maxLength: 20000 }
                sourceChannel: { type: string, enum: [销售, 售后, 电商, 运营/用研, 终端用户, 产品/研发/测试] }
                productModel: { type: string, maxLength: 100, nullable: true }
                requirementType: { type: string, nullable: true }
                constraintNotes: { type: string, maxLength: 2000, nullable: true }
                supplementUrl: { type: string, maxLength: 500, format: uri, nullable: true }
                intakeModule: { type: string, maxLength: 100, nullable: true, description: Must exist in the published module dictionary. }
                owner:
                  type: object
                  nullable: true
                  required: [feishuUserId, feishuIdType]
                  properties:
                    feishuUserId: { type: string, maxLength: 64 }
                    feishuIdType: { type: string, enum: [open_id, user_id, union_id] }
                    tbDisplayName: { type: string, maxLength: 100, nullable: true }
      responses:
        '201':
          description: Requirement collected; analysis and push will proceed asynchronously.
          content:
            application/json:
              schema:
                type: object
                properties:
                  requirementId: { type: string, format: uuid }
                  platformRequirementId: { type: string }
                  sourceType: { type: string, enum: [web_manual] }
                  status: { type: string, enum: [collected] }
        '200': { description: Idempotent replay of the same key and payload. }
        '400': { $ref: '#/components/responses/Validation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { description: The idempotency key was already used with a different payload. }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
    patch:
      summary: Edit a web-manual requirement with optimistic versioning (V02-T07)
      description: >-
        Only web_manual requirements are editable; Teambition facts stay read-only. Requires
        an Idempotency-Key and expectedSourceVersion. Definition changes (title/description/
        product/constraints) atomically create a new source version, snapshot, audit event and
        analysis job and reset the push; metadata changes (channel/type/link) only update the
        projection and queue a non-substantive push; a normalized no-op returns unchanged.
        The same key with the same payload replays the stored outcome; a different payload is
        rejected. A stale expectedSourceVersion returns 409 with the current version.
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 8, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedSourceVersion]
              properties:
                expectedSourceVersion: { type: integer, minimum: 1 }
                title: { type: string, minLength: 1, maxLength: 200 }
                description: { type: string, minLength: 1, maxLength: 20000, nullable: true }
                sourceChannel: { type: string, enum: [销售, 售后, 电商, 运营/用研, 终端用户, 产品/研发/测试] }
                productModel: { type: string, maxLength: 100, nullable: true }
                requirementType: { type: string, nullable: true }
                constraintNotes: { type: string, maxLength: 2000, nullable: true }
                supplementUrl: { type: string, maxLength: 500, format: uri, nullable: true }
      responses:
        '200':
          description: Edit applied (updated / unchanged) or idempotent replay.
          content:
            application/json:
              schema:
                type: object
                properties:
                  requirementId: { type: string, format: uuid }
                  outcome: { type: string, enum: [updated, unchanged, replay] }
                  sourceVersion: { type: integer }
                  substantiveChanged: { type: boolean }
        '400': { $ref: '#/components/responses/Validation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Stale expectedSourceVersion (message carries the current version), TB-source requirement, or idempotency-key payload conflict. }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /api/requirements/{id}/audience:
    put:
      summary: Save PM-confirmed audience tags (V02-T09)
      description: >-
        Multi-select L1-L6 tags; an explicitly saved empty set is a confirmed-empty (distinct from
        unconfirmed). Optimistic audienceVersion; the update only persists tags, confirmation flag,
        a bumped version and an audit event — it never touches priority, Base PM state, or triggers
        analysis/push/notifications. AI suggestions live in the analysis result and are never
        overwritten by or overwriting these tags.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tags, expectedVersion]
              properties:
                tags:
                  type: array
                  maxItems: 6
                  items: { type: string, enum: [L1, L2, L3, L4, L5, L6] }
                expectedVersion: { type: integer, minimum: 0 }
      responses:
        '200':
          description: Tags saved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  requirementId: { type: string, format: uuid }
                  audienceVersion: { type: integer }
                  confirmed: { type: boolean }
                  tags: { type: array, items: { type: string } }
        '400': { $ref: '#/components/responses/Validation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Stale expectedVersion; the message carries the current version. }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /api/requirements/{id}/rice-draft:
    get:
      summary: Read the RICE Beta draft (V02-T11)
      description: >-
        Beta entry lives only in the requirement detail. Reading never calls the model. While the
        RICE measurement config is unapproved (G-RICE), the draft shows 待配置/待补充 and never a
        score or ranking. Fully isolated from the main pipeline.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Draft state (score is always null in this slice).
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      summary: Save the RICE Beta draft with optimistic edit version (V02-T11)
      description: >-
        Saves human-entered Reach/Impact/Confidence/Effort drafts plus rationale notes; appends
        history and records the actor and the requirement source version. Saving never triggers
        analysis, push, or notifications.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedEditVersion]
              properties:
                reach: { type: string, maxLength: 500, nullable: true }
                impact: { type: string, maxLength: 500, nullable: true }
                confidence: { type: string, maxLength: 500, nullable: true }
                effort: { type: string, maxLength: 500, nullable: true }
                notes: { type: string, maxLength: 4000, nullable: true }
                expectedEditVersion: { type: integer, minimum: 0 }
      responses:
        '200': { description: Draft saved; editVersion returned. }
        '400': { $ref: '#/components/responses/Validation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Stale expectedEditVersion; the message carries the current version. }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /api/requirements/{id}:
    get:
      summary: Get requirement source snapshot and latest analysis
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Requirement detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Requirement' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/requirements/{id}/owner:
    put:
      summary: Save an operator-selected owner for this requirement only
      description: >-
        The selection is stored on this requirement (manual_owner_*), never in person_mappings,
        so assigning one requirement never rebinds the TB-executor default owner or affects any
        other requirement. The owner state becomes manually_mapped and a Base push is queued;
        `tbDisplayName` is kept as the owner's display name. The per-requirement owner takes
        precedence over the TB-executor mapping and survives later source updates until the
        operator clears it with DELETE. Every assignment queues its own push, so reassigning
        back to a previous person is pushed again.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                feishuUserId: { type: string, minLength: 1 }
                feishuIdType: { type: string, enum: [open_id, user_id, union_id] }
                tbUserId: { type: [string, 'null'] }
                tbDisplayName: { type: [string, 'null'] }
              required: [feishuUserId, feishuIdType]
      responses:
        '200': { description: Mapping saved and push queued }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: The requirement is not synced, or its owner state does not allow a manual owner
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    delete:
      summary: Clear the per-requirement manual owner and restore the TB default owner
      description: >-
        Clears manual_owner_*, resolves the current TB-executor mapping again, updates the owner
        state (auto_mapped / pending_mapping / not_required) and queues a Base push when a default
        owner exists (or when the requirement has no TB executor and becomes ownerless).
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200': { description: Manual owner cleared; Base push queued when a default owner exists }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: The requirement has no manual owner, or is not synced }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/requirements/{id}/push:
    post:
      summary: Queue a Feishu Base push retry; the queue deduplicates by source and analysis version
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 8, maxLength: 128 }
      responses:
        '202':
          description: Push accepted for asynchronous execution
          content:
            application/json:
              schema:
                type: object
                properties:
                  requirementId: { type: string, format: uuid }
                  status: { type: string, enum: [queued] }
                required: [requirementId, status]
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Requirement is not eligible for push }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/analysis/{id}/retry:
    post:
      summary: Queue a new analysis attempt
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '202': { description: Analysis retry accepted; push is not blocked }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Requirement is already analyzed/running, or its pending state conflicts with a completed job }
  /api/audit:
    get:
      summary: Search workflow audit events
      parameters:
        - name: entityId
          in: query
          schema: { type: string }
        - name: since
          in: query
          schema: { type: string, format: date-time }
        - name: until
          in: query
          schema: { type: string, format: date-time }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200': { description: Audit event page }
  /api/mappings:
    get:
      summary: List active person mappings for the single source
      responses:
        '200':
          description: Active mappings (relationship and match method only; no personal contact fields)
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        teambitionUserId: { type: [string, 'null'] }
                        teambitionDisplayName: { type: [string, 'null'] }
                        feishuUserId: { type: string }
                        feishuIdType: { type: string, enum: [open_id, user_id, union_id] }
                        matchMethod: { type: string, enum: [tb_user_id, unique_name, manual] }
                        createdBy: { type: [string, 'null'] }
                        updatedAt: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/feishu/users:
    get:
      summary: Search Feishu users for manual owner mapping
      description: Standalone host only. Requires a server-side user_access_token with contact:user:search; tenant_access_token is unsupported. Miaoda uses its platform user search followed by /api/feishu/users/resolve instead.
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 2, maxLength: 100 }
      responses:
        '200':
          description: Feishu user candidates
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    maxItems: 20
                    items:
                      type: object
                      properties:
                        openId: { type: string }
                        name: { type: string }
                        enName: { type: string }
                      required: [openId, name]
                required: [items]
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/feishu/users/resolve:
    get:
      summary: Resolve a selected Miaoda internal user to a verified Feishu identity
      description: Requires trusted Miaoda login context. The server verifies the tenant employee association and profile, returning a typed Feishu user ID; it does not save a mapping or enqueue a push.
      parameters:
        - name: platformUserId
          in: query
          required: true
          schema: { type: string, pattern: '^\d{1,30}$' }
      responses:
        '200':
          description: Verified, typed Feishu identity for the existing manual owner mapping action
          content:
            application/json:
              schema:
                type: object
                properties:
                  feishuUserId: { type: string }
                  feishuIdType: { type: string, enum: [open_id, user_id, union_id] }
                  name: { type: string }
                required: [feishuUserId, feishuIdType, name]
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/rules/dictionary:
    get:
      summary: List module dictionary versions
      responses:
        '200':
          description: Dictionary versions, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/ModuleDictionaryVersion' } }
                required: [items]
    post:
      summary: Create a draft module dictionary version
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DictionaryCreate' }
      responses:
        '201':
          description: Draft version created (version is auto-incremented)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModuleDictionaryVersion' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/people:
    get:
      summary: List product-group personnel with their Feishu account bindings
      responses:
        '200':
          description: Current personnel names and their active Feishu account binding, if any
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamPersonList' }
    post:
      summary: Add a person
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
              required: [name]
      responses:
        '201':
          description: Person added
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamPersonList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { description: Duplicate person or source is not configured }
  /api/people/{name}:
    put:
      summary: Rename a person, update module ownership references, and carry the Feishu binding over
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
              required: [name]
      responses:
        '200':
          description: Person renamed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamPersonList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { description: Name conflict or stale person }
    delete:
      summary: Remove a person, clear module ownership references, and deactivate the Feishu binding
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Person removed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamPersonList' }
        '409': { description: Person no longer exists }
  /api/people/{name}/feishu:
    put:
      summary: Bind a roster person to a Feishu identity
      description: Maintains the active name-scoped person mapping used by the requirement owner picker and by unique-name auto-matching. A new binding is stored as a name-based mapping (not a per-requirement hand assignment, so a bulk first push stays silent); rebinding reuses the existing row. One Feishu account may belong to one person only: an existing active mapping for that account that has no person name (a legacy requirement-level mapping that never captured the executor name) is adopted and labelled with this person, while an account already labelled for a different person returns 409. This endpoint never writes to Teambition or Feishu.
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                feishuUserId: { type: string, minLength: 1, maxLength: 200 }
                feishuIdType: { type: string, enum: [open_id, user_id, union_id] }
              required: [feishuUserId, feishuIdType]
              additionalProperties: false
      responses:
        '200':
          description: Binding saved (idempotent when the same identity is already bound)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamPersonList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: Person does not exist, source is not configured, the Feishu account is already bound to another person, or the name has active mappings pointing to different accounts
    delete:
      summary: Unbind a roster person from their Feishu identity
      description: Deactivates every active mapping whose normalized display name matches this person, including mappings that also carry a TB user ID. Later push attempts for this person find no owner identity and stop in owner mapping; Base rows already pushed are not modified.
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Binding removed (idempotent when the person had no active binding)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamPersonList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { description: Person does not exist or source is not configured }
  /api/modules:
    get:
      summary: Get the active function-module dictionary
      responses:
        '200':
          description: Active dictionary version and entries
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FunctionModuleDirectory' }
    put:
      summary: Replace the active function-module dictionary
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                version: { type: integer, minimum: 0 }
                items:
                  type: array
                  # A published dictionary must carry at least one module. Readers fall back
                  # to the built-in list only while nothing is published, so an empty
                  # published version would retire the real taxonomy and degrade every
                  # classification to 无法识别. No endpoint can retire a version, so the
                  # loss would be one-way.
                  minItems: 1
                  items: { $ref: '#/components/schemas/FunctionModuleEntry' }
              required: [version, items]
      responses:
        '200':
          description: New dictionary version published
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FunctionModuleDirectory' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { description: Stale version, empty module list, or invalid module owner }
  /api/rules/dictionary/{version}/publish:
    post:
      summary: Publish a draft dictionary version; retires the previously published version
      parameters:
        - name: version
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Published version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModuleDictionaryVersion' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Version exists but is not a draft }
  /api/rules/priority:
    get:
      summary: List priority rule versions
      responses:
        '200':
          description: Rule versions, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/PriorityRuleVersion' } }
                required: [items]
    post:
      summary: Create a draft priority rule version
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PriorityRuleCreate' }
      responses:
        '201':
          description: Draft rule version created (version is auto-incremented)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PriorityRuleVersion' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/rules/priority/{id}/publish:
    post:
      summary: Publish a draft rule version; retires the previously published version
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Published rule version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PriorityRuleVersion' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Rule version exists but is not a draft }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    BadRequest:
      description: Request validation failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing or invalid identity
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Feishu platform or integration denied access; RQ-Sys does not apply app-level roles
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Conflicting concurrent operation
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InternalError:
      description: Internal error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RouteNotImplemented:
      description: Endpoint defined by the contract but not yet implemented
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ServiceUnavailable:
      description: Dependency unavailable
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Error:
      type: object
      description: Uniform error envelope; messages never echo credentials, personal contact information or raw provider responses.
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
          required: [code, message]
      required: [error]
    OverviewMetrics:
      type: object
      properties:
        total: { type: integer, minimum: 0 }
        pullSynced: { type: integer, minimum: 0 }
        analysisAnalyzed: { type: integer, minimum: 0 }
        ownerResolved: { type: integer, minimum: 0 }
        pushPushed: { type: integer, minimum: 0 }
        failed: { type: integer, minimum: 0 }
      required: [total, pullSynced, analysisAnalyzed, ownerResolved, pushPushed, failed]
    BatchStatus:
      type: string
      enum: [running, succeeded, partial_failure, failed]
    PullState:
      type: string
      enum: [pending, running, synced, failed, collected]
    AnalysisState:
      type: string
      enum: [pending, running, analyzed, failed_retryable]
    OwnerState:
      type: string
      enum: [pending_mapping, auto_mapped, manually_mapped, not_required]
    PushState:
      type: string
      enum: [pending, running, pushed, failed]
    SourceConfig:
      type: object
      properties:
        id: { type: string, format: uuid }
        projectName: { type: string, description: Teambition project selected by the source configuration. }
        enabled: { type: boolean }
        schedule:
          type: object
          properties:
            enabled: { type: boolean }
            weekday: { type: [integer, 'null'], minimum: 1, maximum: 7 }
            time: { type: [string, 'null'], pattern: '^(?:[01][0-9]|2[0-3]):[0-5][0-9]$', description: Local wall-clock time in HH:mm precision. }
            timezone: { type: [string, 'null'] }
          required: [enabled, weekday, time, timezone]
      required: [id, projectName, enabled, schedule]
    SourceConfigUpdate:
      type: object
      properties:
        projectName: { type: string, minLength: 1, default: 室外产品-码表软固件需求池, description: Exact Teambition project name. The server resolves project and task type IDs. }
        enabled: { type: boolean }
        schedule:
          type: object
          properties:
            enabled: { type: boolean }
            weekday: { type: [integer, 'null'], minimum: 1, maximum: 7 }
            time: { type: [string, 'null'], pattern: '^(?:[01][0-9]|2[0-3]):[0-5][0-9]$', description: Local wall-clock time in HH:mm precision. }
            timezone: { type: [string, 'null'] }
          required: [enabled, weekday, time, timezone]
      required: [projectName, enabled, schedule]
    Requirement:
      type: object
      properties:
        id: { type: string, format: uuid }
        sourceRequirementId: { type: string, nullable: true }
        # V02-T02 加法：来源类型与业务来源渠道；TB 行 sourceRequirementId 必有，手工行为空。
        # （T02 时该段遗漏未落库，2026-10-25 随 T05 补齐。）
        sourceType: { type: string, enum: [teambition, web_manual] }
        sourceChannel: { type: string, nullable: true }
        # V02-T05：手工精简上下文（全部可空；未知留空，不自动补造）。
        productModel: { type: string, nullable: true }
        requirementType: { type: string, nullable: true }
        constraintNotes: { type: string, nullable: true }
        supplementUrl: { type: string, nullable: true }
        intakeModule: { type: string, nullable: true, description: Web-entered module from the controlled dictionary (G-MODULE). }
        audience:
          type: object
          description: PM-confirmed audience state (V02-T09); AI suggestions stay in the analysis result.
          properties:
            tags: { type: array, items: { type: string, enum: [L1, L2, L3, L4, L5, L6] } }
            confirmed: { type: boolean }
            version: { type: integer }
        # RQ-Sys 展示用连续编号（RQ-000001）；迁移未执行时为 null。
        platformRequirementId: { type: string, nullable: true }
        title: { type: string }
        description: { type: string, nullable: true }
        sourceVersion: { type: integer }
        updatedAt: { type: string, format: date-time }
        sourceUrl: { type: string, nullable: true }
        lastPushedAt: { type: string, format: date-time, nullable: true }
        # 优先展示 Web 为该需求单独指定的负责人；否则为 TB 执行人映射的人员姓名；解析不到为 null。
        ownerName: { type: string, nullable: true }
        # 该需求被单独指定的负责人（优先于 TB 执行人映射，且不影响其他需求）。
        manualOwner:
          type: [object, 'null']
          properties:
            feishuUserId: { type: string }
            feishuIdType: { type: string, enum: [open_id, user_id, union_id] }
            name: { type: [string, 'null'] }
            assignedAt: { type: string, format: date-time }
          required: [feishuUserId, feishuIdType, assignedAt]
        # 同标题疑似重复时指向最早那条需求，仅作提示；列表仍返回。
        duplicateOf: { type: [string, 'null'], format: uuid }
        # 仅详情接口返回：以本需求为主记录的同标题重复项（供红色提示和详情链接）。
        duplicates:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              title: { type: string }
              teambitionRequirementId: { type: string }
            required: [id, title, teambitionRequirementId]
        pipeline:
          type: object
          properties:
            pull: { $ref: '#/components/schemas/PullState' }
            analysis: { $ref: '#/components/schemas/AnalysisState' }
            owner: { $ref: '#/components/schemas/OwnerState' }
            push: { $ref: '#/components/schemas/PushState' }
          required: [pull, analysis, owner, push]
        source: { type: object, additionalProperties: true }
        analysis: { type: [object, 'null'], additionalProperties: true }
        analyses:
          type: array
          description: Prior and current analysis version summaries (spec 02 prior versions); newest last.
          items:
            type: object
            properties:
              analysisVersion: { type: integer }
              status: { $ref: '#/components/schemas/AnalysisState' }
              moduleSuggestion: { type: [string, 'null'] }
              confidence: { type: [string, 'null'], enum: [高, 中, 低, null] }
              priority: { type: [string, 'null'], enum: [P0, P1, P2, P3, null] }
              startedAt: { type: string, format: date-time }
              completedAt: { type: [string, 'null'], format: date-time }
              safeErrorSummary: { type: [string, 'null'] }
        baseRecordId: { type: [string, 'null'] }
      required: [id, sourceRequirementId, title, sourceVersion, pipeline, source, analysis, analyses, baseRecordId]
    Batch:
      type: object
      properties:
        id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/BatchStatus' }
        triggerType: { type: string, enum: [manual, scheduled] }
        actorId: { type: [string, 'null'] }
        totalCount: { type: integer }
        succeededCount: { type: integer }
        failedCount: { type: integer }
        items: { type: array, items: { type: object, additionalProperties: true } }
      required: [id, status, totalCount, succeededCount, failedCount, items]
    PublishStatus:
      type: string
      enum: [draft, published, retired]
    ModuleDictionaryVersion:
      type: object
      description: Versioned module dictionary; only the published version feeds AI analysis.
      properties:
        version: { type: integer, minimum: 1 }
        status: { $ref: '#/components/schemas/PublishStatus' }
        entries:
          type: array
          items:
            oneOf:
              - type: string
              - $ref: '#/components/schemas/FunctionModuleEntry'
        createdBy: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        publishedAt: { type: [string, 'null'], format: date-time }
      required: [version, status, entries, createdBy, createdAt, publishedAt]
    FunctionModuleEntry:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        personName: { type: [string, 'null'], maxLength: 100 }
      required: [name, personName]
      additionalProperties: false
    TeamPerson:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        # 绑定关系来自 person_mappings 的活跃行；unbound 时三个绑定字段均为 null。
        feishuUserId: { type: [string, 'null'], maxLength: 200 }
        feishuIdType: { type: [string, 'null'], enum: [open_id, user_id, union_id, null] }
        boundAt: { type: [string, 'null'], format: date-time }
        # 同名映射指向多个不同飞书账号时为 true：需要人工核对，不显示为已绑定。
        bindingConflict: { type: boolean }
      required: [name, feishuUserId, feishuIdType, boundAt, bindingConflict]
      additionalProperties: false
    TeamPersonList:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/TeamPerson' } }
      required: [items]
      additionalProperties: false
    FunctionModuleDirectory:
      type: object
      properties:
        version: { type: integer, minimum: 0 }
        items: { type: array, items: { $ref: '#/components/schemas/FunctionModuleEntry' } }
      required: [version, items]
      additionalProperties: false
    DictionaryCreate:
      type: object
      properties:
        entries: { type: array, items: { type: string, minLength: 1 }, minItems: 1 }
      required: [entries]
      additionalProperties: false
    PriorityRuleVersion:
      type: object
      description: Versioned priority rule; priority stays blank until a rule version is published.
      properties:
        id: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        status: { $ref: '#/components/schemas/PublishStatus' }
        rules: { type: object, additionalProperties: true }
        validationEvidence: { type: array, items: { type: object, additionalProperties: true } }
        createdBy: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        publishedAt: { type: [string, 'null'], format: date-time }
      required: [id, version, status, rules, validationEvidence, createdBy, createdAt, publishedAt]
    PriorityRuleCreate:
      type: object
      description: Rule payload carries the approved U/M/S/C scoring maps and deterministic thresholds; the interpreter never invents a formula, and an empty validation evidence list keeps the rule unusable for computation.
      properties:
        rules:
          type: object
          properties:
            scoring:
              type: object
              description: Approved value-to-score map per U/M/S/C dimension; recommendations outside the map keep priority blank.
              properties:
                user: { type: object, additionalProperties: { type: number } }
                market: { type: object, additionalProperties: { type: number } }
                business: { type: object, additionalProperties: { type: number } }
                technology: { type: object, additionalProperties: { type: number } }
              required: [user, market, business, technology]
              additionalProperties: false
            thresholds:
              type: object
              properties:
                p0: { type: number, minimum: 0, maximum: 4 }
                p1: { type: number, minimum: 0, maximum: 4 }
                p2: { type: number, minimum: 0, maximum: 4 }
              required: [p0, p1, p2]
              additionalProperties: false
          required: [scoring, thresholds]
          additionalProperties: false
        validationEvidence: { type: array, items: { type: object, additionalProperties: true } }
      required: [rules]
      additionalProperties: false
